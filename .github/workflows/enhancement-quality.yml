name: Enhancement Compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["bin/**", "src-tauri/**", "tests/**", "build/pi-web/**", ".github/**", "package.json", "pnpm-lock.yaml"]
  pull_request:
    paths: ["bin/**", "src-tauri/**", "tests/**", "build/pi-web/**", ".github/**", "package.json", "pnpm-lock.yaml"]

permissions:
  contents: read

jobs:
  compatibility:
    name: Enhancements / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-env
        with:
          mode: build
          rust-cache-save: false
      - name: Install Rust checks
        run: rustup component add clippy rustfmt
      - name: Add Windows ARM64 target
        if: matrix.os == 'windows-11-arm'
        run: rustup target add aarch64-pc-windows-msvc
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 xdg-utils gsettings-desktop-schemas
          sudo glib-compile-schemas /usr/share/glib-2.0/schemas
      - name: Build and test CLI
        run: |
          pnpm run cli:build
          pnpm exec vitest run
      - name: Pi Web popup compatibility
        run: node --test build/pi-web/tests/popup.test.mjs
      - name: Install Pi Web browser test runtime
        if: runner.os == 'macOS'
        run: |
          npm install --prefix "$RUNNER_TEMP/pi-web-browser" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/pi-web-browser/node_modules/playwright/cli.js" install chromium
      - name: Pi Web browser compatibility
        if: runner.os == 'macOS'
        env:
          PAKE_PLAYWRIGHT_MODULE: ${{ runner.temp }}/pi-web-browser/node_modules/playwright/index.mjs
        run: node --test build/pi-web/tests/titlebar.test.mjs build/pi-web/tests/file-open.test.mjs
      - name: Pi Web native popup acceptance
        if: runner.os == 'macOS'
        run: node build/pi-web/tests/native-popup.mjs
      - name: Native opener permission acceptance
        if: runner.os == 'macOS'
        run: |
          node tests/integration/ipc-security.mjs
          node tests/integration/enhancement-open-path.mjs
      - name: Check workspace and feature compatibility
        working-directory: src-tauri
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          for features in "" managed-server runtime-template managed-server,runtime-template; do
            echo "::group::Cargo features: ${features:-default}"
            cargo test --locked --workspace --lib --features "$features"
            cargo clippy --locked --workspace --all-targets --features "$features" -- -D warnings
            echo "::endgroup::"
          done
          cargo tree --locked -p pake-enhancements -e normal > "$RUNNER_TEMP/enhancement-dependencies.txt"
          node -e 'if (require("fs").readFileSync(process.argv[1], "utf8").includes("tauri-plugin-dialog")) throw new Error("Ordinary builds enable dialog")' "$RUNNER_TEMP/enhancement-dependencies.txt"
      - name: Verify packaged sources
        run: |
          npm pack --dry-run --ignore-scripts --json > "$RUNNER_TEMP/enhancement-pack.json"
          node -e 'const files = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0].files.map(f => f.path); for (const file of ["Cargo.toml", "src/lib.rs", "src/window.js", "src/open_path.rs"]) if (!files.includes("src-tauri/extensions/pake-enhancements/" + file)) throw new Error("Missing packaged enhancement: " + file)' "$RUNNER_TEMP/enhancement-pack.json"
      - name: Native WebView acceptance
        if: runner.os != 'Linux'
        run: node tests/integration/managed-local-app.mjs
      - name: Native WebView acceptance on Linux
        if: runner.os == 'Linux'
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a dbus-run-session -- node tests/integration/managed-local-app.mjs
      - name: Verify Windows ARM64 installer
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP "pake-arm64-installer"
          New-Item -ItemType Directory -Path $directory | Out-Null
          Push-Location $directory
          try {
            $cli = Join-Path $env:GITHUB_WORKSPACE "dist/cli.js"
            $result = node $cli http://127.0.0.1:8123 --name PakeArmProbe --targets arm64 --server-port 8123 --server-command "echo fixture" --debug --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $result.ok -or $result.arch -ne 'arm64' -or $result.outputs.Count -ne 1) { throw "ARM64 build failed" }
            $installerPath = $result.outputs[0].path
            if (-not (Test-Path $installerPath) -or (Get-Item $installerPath).Length -eq 0) { throw "Missing installer" }
            $installer = New-Object -ComObject WindowsInstaller.Installer
            $summary = $installer.GetType().InvokeMember('SummaryInformation', 'GetProperty', $null, $installer, @($installerPath, 0))
            $template = $summary.GetType().InvokeMember('Property', 'GetProperty', $null, $summary, @(7))
            if ($template -notmatch '^Arm64;') { throw "Unexpected MSI platform: $template" }
          } finally { Pop-Location }
