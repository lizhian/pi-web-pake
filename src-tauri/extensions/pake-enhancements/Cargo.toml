[package]
name = "pake-enhancements"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.10.2", default-features = false, features = ["wry"] }
tauri-plugin-dialog = { version = "2.7.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[features]
default = []
managed-server = ["dep:libc", "dep:windows-sys", "dep:tauri-plugin-dialog"]
